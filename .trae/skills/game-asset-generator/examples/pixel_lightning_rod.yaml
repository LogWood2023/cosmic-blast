project: "像素风避雷针"
output_dir: "./generated_assets/pixel_lightning_rod"

style:
  style_lock: "pixel art, 16-bit SNES era, game item sprite, top-down view, bright solid green background, sharp pixel edges, flat shading, lightning rod/air terminal"
  color_palette: "muted grays, dark grays, silver, metallic blue, bright lime green background"
  quality: "game sprite, clean pixel edges"
  negative: "blurry, realistic, 3D render, photorealistic, perspective, gradient, soft edges, anti-aliased, watermark, text, character, human, scattered particles, bright colors, green on subject"

pixel_clean:
  enabled: true
  target_size: 256
  num_colors: 16
  contrast: 1.2

assets:
