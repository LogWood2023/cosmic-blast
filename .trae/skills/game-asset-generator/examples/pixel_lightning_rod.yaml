    name: "lightning_rod_1"
    size: "1024x1024"
    model: "gpt-image-2"
    extra_prompt: "solid bright green background, pure green chroma key backdrop, no green on subject, top-down view 2D sprite, centered filling frame, pixel art lightning rod/air terminal, metallic, top-down view"
    variants:
      - description: "pixel art lightning rod, simple straight rod with pointed tip, metallic, top-down view"
        count: 1
      - description: "pixel art lightning rod, with small base and attached wires, metallic, top-down view"
        count: 1
      - description: "pixel art lightning rod, industrial design with multiple points, metallic, top-down view"
        count: 1
