    variants:
      - description: "simple thin rectangular turret barrel, pixel art, sci-fi metal barrel, only the barrel, no other parts, top-down view"
        count: 1
      - description: "simple thin rectangular turret barrel, pixel art, slightly thicker sci-fi metal barrel, only the barrel, no other parts, top-down view"
        count: 1
      - description: "simple thin rectangular turret barrel, pixel art, long thin sci-fi metal barrel, only the barrel, no other parts, top-down view"
